name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check

      # node 22 treats positional args as glob patterns; a bare directory such as
      # `test/` matches the directory itself and is executed as a test file.
      # Use an explicit glob so CI behaves the same on every Node version, and
      # exclude test/browser/smoke.mjs (it needs a browser and CLI arguments).
      - name: Test
        run: node --test "test/**/*.test.js"
